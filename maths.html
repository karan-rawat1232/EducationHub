<!DOCTYPE html>
<html lang="hi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Maths Solver | Education Hub</title>

  <link rel="stylesheet" href="style.css">
</head>

<body>

  <header class="navbar">

    <div class="logo">
      🎓 <span>Education</span> Hub
    </div>

    <nav>
      <a href="index.html">Home</a>
      <a href="maths.html">Maths</a>
    </nav>

  </header>


  <main>

    <section class="section">

      <div class="section-heading">

        <span>🧮 MATHS SOLVER</span>

        <h1>
          अपना Maths Question Solve करें
        </h1>

        <p>
          नीचे अपना question लिखें और solution देखें।
        </p>

      </div>


      <div class="maths-box">

        <label for="mathQuestion">
          ✏️ अपना Question लिखें
        </label>

        <textarea
          id="mathQuestion"
          placeholder="Example: 2x + 5 = 15"
          rows="5"
        ></textarea>


        <button
          id="solveBtn"
          class="primary-btn"
          type="button"
        >
          🧮 Solve Question
        </button>


        <div
          id="answerBox"
          class="answer-box"
        >

          <h3>
            💡 Solution यहाँ दिखाई देगा
          </h3>

          <p>
            पहले अपना question लिखकर
            Solve Question दबाएँ।
          </p>

        </div>

      </div>

    </section>

  </main>


  <footer>

    <div class="footer-logo">
      🎓 Education Hub
    </div>

    <p>
      Learn • Practice • Grow
    </p>

  </footer>


  <script>

    const solveBtn =
      document.getElementById("solveBtn");

    const questionInput =
      document.getElementById("mathQuestion");

    const answerBox =
      document.getElementById("answerBox");


    solveBtn.addEventListener("click", function () {

      const question =
        questionInput.value.trim();


      if (question === "") {

        answerBox.innerHTML = `
          <h3>⚠️ Question लिखिए</h3>
          <p>
            पहले Maths question लिखें।
          </p>
        `;

        return;
      }


      if (
        question.includes("2x") &&
        question.includes("5") &&
        question.includes("15")
      ) {

        answerBox.innerHTML = `

          <h3>✅ Step-by-Step Solution</h3>

          <p>
            <strong>Question:</strong>
            ${question}
          </p>

          <br>

          <p>
            <strong>Step 1:</strong>
            2x + 5 = 15
          </p>

          <p>
            <strong>Step 2:</strong>
            2x = 15 - 5
          </p>

          <p>
            <strong>Step 3:</strong>
            2x = 10
          </p>

          <p>
            <strong>Step 4:</strong>
            x = 10 ÷ 2
          </p>

          <h2>
            🎯 Final Answer: x = 5
          </h2>

          <p>
            💡 Trick: पहले constant को दूसरी
            side ले जाकर equation को simplify करें।
          </p>

        `;

      } else {

        answerBox.innerHTML = `

          <h3>🤖 Question Received</h3>

          <p>
            आपका question:
          </p>

          <p>
            <strong>${question}</strong>
          </p>

          <br>

          <p>
            अभी हमारा basic solver केवल demo
            question के साथ काम कर रहा है।
          </p>

          <p>
            🔜 आगे हम इसमें अलग-अलग Maths
            questions solve करने की सुविधा जोड़ेंगे।
          </p>

        `;

      }

    });

  </script>

</body>
</html>
